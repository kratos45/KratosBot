[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kratosbot"
version = "0.1.0"
description = "A memory-aware conversational chatbot powered by Groq and Python."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "KratosBot Contributors"}]
dependencies = [
  "openai>=1.68,<3",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
kratosbot = "kratosbot.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:.*StarletteDeprecationWarning.*",
  "ignore:.*Using `httpx` with `starlette.testclient`.*",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
